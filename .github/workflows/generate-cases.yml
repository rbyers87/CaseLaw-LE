name: Generate Case HTML Files

on:
  push:
    paths:
      - 'generate_cases.py'   # Run when this file changes
    branches:
      - main                  # Change to 'master' if your default branch is master
  workflow_dispatch:          # Allows manual trigger from the Actions tab

permissions:
  contents: write            # Required to commit files back

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generation script
        run: python generate_cases.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cases/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate case files [skip ci]"
            git push
          fi
